name: Build SmartTube AI Dub Signed

on:
  workflow_dispatch:
  push:
    branches:
      - ai-dub-core

# The updater publishes to one rolling `ai-dub-latest` release. Serializing
# builds prevents overlapping runs from deleting/re-uploading the same release
# assets at the same time and leaving the update channel half-published.
concurrency:
  group: smarttube-ai-dub-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout AI Dub repository
        uses: actions/checkout@v4
        with:
          ref: ai-dub-core

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check audio buffering and volume regression
        run: bash tools/check_playback.sh

      - name: Build permanently signed SmartTube AI Dub
        shell: bash
        env:
          AIDUB_KEYSTORE_B64: ${{ secrets.AIDUB_KEYSTORE_B64 }}
          AIDUB_KEYSTORE_PASSWORD: ${{ secrets.AIDUB_KEYSTORE_PASSWORD }}
        run: |
          chmod +x tools/build_core_ci.sh
          ./tools/build_core_ci.sh

      - name: Publish in-app update channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x tools/publish_update.sh
          ./tools/publish_update.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-AI-Dub-Signed-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
