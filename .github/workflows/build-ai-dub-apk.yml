name: Build SmartTube AI Dub APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "payload/**"
      - ".github/workflows/build-ai-dub-apk.yml"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout AI Dub repo
        uses: actions/checkout@v4

      - name: Reconstruct AI Dub overlay
        run: |
          set -euo pipefail
          cat payload/min*.b64 | tr -d '\n\r ' | base64 --decode > aidub-min.zip
          mkdir -p reconstructed
          unzip -q -o aidub-min.zip -d reconstructed
          test -f reconstructed/overlay/tools/apply_all_v04.sh
          chmod +x reconstructed/overlay/tools/*.sh
          sha256sum aidub-min.zip

      - name: Checkout SmartTube 32.56 Stable
        uses: actions/checkout@v4
        with:
          repository: yuliskov/SmartTube
          ref: 32.56s
          submodules: recursive
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Apply AI Dub v0.4 overlay
        run: |
          set -euo pipefail
          reconstructed/overlay/tools/apply_all_v04.sh "$GITHUB_WORKSPACE/upstream"

      - name: Build stable debug APKs
        working-directory: upstream
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean :smarttubetv:assembleStstableDebug

      - name: List APKs and hashes
        run: |
          set -euo pipefail
          find upstream/smarttubetv/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Upload stable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-AI-Dub-v0.4-APKs
          path: upstream/smarttubetv/build/outputs/apk/ststable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
